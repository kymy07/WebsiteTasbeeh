name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          for s in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!s}" ]; then
              echo "::error::Missing repo secret $s (Settings > Secrets and variables > Actions)"
              exit 1
            fi
          done

      - name: Deploy to production
        run: npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"

      - name: Health check
        run: curl -fsS -o /dev/null --retry 5 --retry-delay 5 --retry-all-errors https://fishfarmdemo.vercel.app/
